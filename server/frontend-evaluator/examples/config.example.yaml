# Example YAML configuration for Frontend Evaluator

rules:
  enabled:
    - html-validation
    - css-performance
    - javascript-security
    - accessibility-check
  disabled:
    - legacy-browser-support
    - deprecated-api-usage
  custom: []

thresholds:
  minScore: 80
  failOnCritical: true

output:
  format: JSON
  includeCodeSnippets: true
  detailedFindings: true